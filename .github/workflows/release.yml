name: release

# `npm version minor && git push --follow-tags` → a GitHub release with git-graph.zip attached
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # The newest patch of the line, not the runner's cached one: 24.22.1 fixes CVE-2026-111497
          check-latest: true
      - run: node --version
      - run: npm run test:node
      - run: npm run zip
      # The tag's section of CHANGELOG.md is the release's notes; GitHub adds the merged changes under it
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{on = ($2 == v)} on' CHANGELOG.md | tail -n +2 > dist/notes.md
          test -s dist/notes.md || echo "No CHANGELOG.md section for $version." > dist/notes.md
          cat dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/git-graph.zip
          body_path: dist/notes.md
          generate_release_notes: true
