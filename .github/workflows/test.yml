name: test

on:
  push:
    branches: [main, develop]
  pull_request:

# The jobs only read the repo
permissions:
  contents: read

jobs:
  logic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # The newest patch of the line, not the runner's cached one: 22.23.4 and 24.22.1 fix CVE-2026-111497
          check-latest: true
      - run: node --version
      - run: npm run test:node

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - run: node --version
      # A fixed Claude Code, the one the mod is tested on: raise it on purpose, not on every run
      - run: npm install -g @anthropic-ai/claude-code@2.1.304
      - run: npm run validate
      - run: npm run test:mod
